      .loader {

        -webkit-box-align: center;

      @media  only screen and (max-width:767px){
       .loader-block{
         width: 100%;
         height: 50vw;
       }
      }
    
      .loader-block:before{
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #CDAF36;
        -webkit-transform-origin: center;

      .is-loaded .liner_ {

        -webkit-transform: translateY(100%);

    function mediaSwiper(swiperTarge) {

            var tragetData = `${swiperTarge} .swiper-container`

            var slides = $(swiperTarge).find('.swiper-slide').length;

            if(slides < 2){
                $(swiperTarge).find('.swiper_nav').hide();
            }

            mediaSwiperMain: {
                 new Swiper(tragetData, {
                    slidesPerView: 3,
                    spaceBetween: 30,
                    speed: 500,
                    navigation: {
                        nextEl: `${swiperTarge} .next_`,
                        prevEl: `${swiperTarge} .prev_`,
                    },
                    breakpoints: {
                        0: {
                            slidesPerView: 1,
                        },
                        960: {
                            slidesPerView: 2,
                        },
                        1024: {
                            slidesPerView: 3,
                        }
                    },
                    on: {
                        init: function() {
                            window.bLazy.revalidate();
                        },
                        slideChange: function() {
                            window.bLazy.revalidate();
                        }
                    },

                });
            }

            
        };

        mediaSwiper('[data-photo-swiper]');
        mediaSwiper('[data-video-swiper]');
        mediaSwiper('[data-report-swiper]');

        $('[data-tab-nav]').on('click', function() {
            setTimeout(function() {
                mediaSwiper('[data-photo-swiper]');
                mediaSwiper('[data-video-swiper]');
                mediaSwiper('[data-report-swiper]');
            },100)
        });



    function sendAjax(url, type, dataToSend, callback, async) {
        if ($('#commonAjaxLoader').length) {
            $('#commonAjaxLoader').show();
        }
        $.ajax({
            url: url,
            type: type,
            async: async !==undefined ? async :false,
            data: dataToSend,
            dataType: 'json',
            statusCode: {
                302: function() {
                    alert('Forbidden. Access Restricted');
                },
                403: function() {
                    alert('Forbidden. Access Restricted', '403');
                },
                404: function() {
                    alert('Page not found', '404');
                },
                500: function() {
                    alert('Unexpected Error', '500');
                }
            }
        }).done(function(responseData) {
            callback(responseData);
            $('#commonAjaxLoader').hide();

        }).fail(function(jqXHR, textStatus) {
            $('#commonAjaxLoader').hide();
            callback(jqXHR);

        });
    }

    var recaptchaArr = [];

    function CaptchaCallback() {
        $('.recaptcha').each(function() {
            var id = $(this).attr('id');
            if (id) {
                var tmp = grecaptcha.render($(this).attr('id'), {
                    'sitekey': '6LdrSBsUAAAAAK4SPutVxZFwpJ7Cl6kTb93wITcb',
                    'theme': 'light',
                    'lang': 'en'
                });
                recaptchaArr.push({
                    ID: $(this).attr('id'),
                    obj: tmp
                });
            }
        })

    };

    function haveRecaptchaResponse(elemID) {
        var hasResponse = false;
        $(recaptchaArr).each(function(i, v) {
            if (v.ID == elemID) {
                if (grecaptcha.getResponse(v.obj) != '') {
                    hasResponse = true;
                }
            }
        });
        return hasResponse;
    }

    function renderLoadMoreButton(obj) {

	    ];

	    $("#" + obj.wrapperName).after(button.join(''));
	}

    function loaderButtonStatus(el, paginateURL) {
	  	if(paginateURL === "") {
	         $(el).hide();
	      } else {
	         $(el).show();
	         $(el).attr("data-redirect", paginateURL);
	      }
	}
